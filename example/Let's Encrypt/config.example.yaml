# 证书管理服务配置模板
# 敏感信息（AccessKey 等）建议通过环境变量注入，见下方 env 说明

server:
  addr: ":8080"
  mode: debug

database:
  path: "data/certs.db"

acme:
  ca_dir: staging              # staging（测试，不限速）/ production（生产）
  email: "admin@example.com"
  account_path: "data/accounts"
  renew_before: 0.33           # 剩余 1/3 有效期时续期（ARI 优先）
  key_type: ECDSA              # ECDSA / RSA

dns:
  default: alidns
  providers:
    alidns:
      access_key_id: ""        # 或用环境变量 LETS_DNS_ALIDNS_AK_ID
      access_key_secret: ""    # 或用环境变量 LETS_DNS_ALIDNS_AK_SECRET
      region: ""
  # 域名 → 服务商映射（支持根域名和 *.根域名）
  domains:
    "example.com": alidns

aliyun:
  region: "cn-hangzhou"
  access_key_id: ""            # 或用环境变量 LETS_ALIYUN_AK_ID
  access_key_secret: ""        # 或用环境变量 LETS_ALIYUN_AK_SECRET
  cas:
    enabled: true
  oss:
    private_bucket: "your-private-bucket"   # 私钥中转（私有）
    private_prefix: "cert-transfer"
  ecs:
    enabled: true

scheduler:
  enabled: true
  interval: 6                  # 每 6 小时检查一次续期

log:
  level: info
  dir: logs

# ============ 环境变量 ============
# LETS_ALIYUN_AK_ID             阿里云 RAM 子账户 AccessKey ID
# LETS_ALIYUN_AK_SECRET         阿里云 RAM 子账户 AccessKey Secret
# LETS_DNS_ALIDNS_AK_ID         阿里云 DNS AccessKey ID（可与上面相同）
# LETS_DNS_ALIDNS_AK_SECRET     阿里云 DNS AccessKey Secret
# LETS_ACME_EMAIL               ACME 注册邮箱
# LETS_CA_DIR                   staging / production
# LETS_DB_PATH                  SQLite 数据库路径
